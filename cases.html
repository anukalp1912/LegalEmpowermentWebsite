<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Cases - RightsMitra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content-wrapper">
        <header style="margin-top:24px; margin-bottom:12px;">
            <h2 style="color:white;">My Previous Cases</h2>
            <p style="color:#94A3B8;">Your saved cases (guest session preserved until you sign up).</p>
        </header>

        <div id="casesList"></div>

        <section id="caseDetail" class="case-detail" aria-live="polite" aria-label="Saved case details"></section>

        <div style="margin-top:24px;">
            <a href="index.html" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // When loaded, script.js's renderCasesOnPage will populate #casesList
        document.addEventListener('DOMContentLoaded', () => {
            // Extra UI behavior for the local demo session.
            const user = getCurrentUser();
            if (user && user.guest_flag) {
                const note = document.createElement('p');
                note.style.color = '#FBBF24';
                note.textContent = 'You are using a guest session. Cases remain in this browser until its local data is cleared.';
                document.querySelector('.content-wrapper').insertBefore(note, document.getElementById('casesList'));
            }
        });
    </script>
</body>
</html>
